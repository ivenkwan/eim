quarkus.application.name=eim-calc-engine
quarkus.http.port=8082

# --- DataSource (PostgreSQL, arch \u00a79) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eim}
quarkus.datasource.password=${DB_PASSWORD:eim-dev}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:eim-postgres}:${DB_PORT:5432}/${DB_NAME:eim}

# --- Flyway (own history table, ADR-010) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.table=flyway_calc_engine
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# --- Kafka (AD-7): run orchestration events ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.calc-run-in.connector=smallrye-kafka
mp.messaging.incoming.calc-run-in.topic=eim.calc.run.requested
mp.messaging.incoming.calc-run-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.calc-run-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.calc-run-in.group.id=eim-calc-engine
mp.messaging.incoming.calc-run-in.auto.offset.reset=earliest
mp.messaging.incoming.calc-run-in.dead-letter-queue.topic=eim.calc.run.requested.dlq
mp.messaging.outgoing.calc-run-out.connector=smallrye-kafka
mp.messaging.outgoing.calc-run-out.topic=eim.calc.run.completed
mp.messaging.outgoing.calc-run-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.calc-run-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Observability ---
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=true

# --- Tests: real PostgreSQL (AGE image) via port-forward ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=${EIM_TEST_DB_URL:jdbc:postgresql://localhost:15433/eim}
%test.quarkus.flyway.table=flyway_calc_engine
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
%test.quarkus.otel.enabled=false
%test.kafka.bootstrap.servers=${EIM_TEST_KAFKA:localhost:19092}

# --- OpenTelemetry (NFR-90) ---
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}

# --- Health (smallrye-health defaults: /q/health/live, /q/health/ready) ---

