quarkus.application.name=eim-plan-compiler
quarkus.http.port=8084

# --- DataSource (PostgreSQL, arch \u00a79) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eim}
quarkus.datasource.password=${DB_PASSWORD:eim-dev}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:eim-postgres}:${DB_PORT:5432}/${DB_NAME:eim}

# --- Flyway (own history table, ADR-010) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.table=flyway_plan_compiler
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# --- Auth: dev gateway-trust headers (SSO mode in staging/prod; SEC-2) ---
eim.auth.mode=${EIM_AUTH_MODE:header}

# --- Kafka (AD-7): plan publish events ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.plan-events-out.connector=smallrye-kafka
mp.messaging.outgoing.plan-events-out.topic=eim.plan.published
mp.messaging.outgoing.plan-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.plan-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Observability ---
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=true

# --- Tests: real PostgreSQL (AGE image) via port-forward ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=${EIM_TEST_DB_URL:jdbc:postgresql://localhost:15433/eim}
%test.quarkus.flyway.table=flyway_plan_compiler
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
%test.quarkus.otel.enabled=false
%test.kafka.bootstrap.servers=${EIM_TEST_KAFKA:localhost:19092}

# --- OpenTelemetry (NFR-90) ---
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}

# --- Health (smallrye-health defaults: /q/health/live, /q/health/ready) ---

