quarkus.application.name=eim-connectors
quarkus.http.port=8081

# --- DataSource (shared PostgreSQL, arch section 9; own Flyway history ADR-010) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eim}
quarkus.datasource.password=${DB_PASSWORD:eim-dev}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:eim-postgres}:${DB_PORT:5432}/${DB_NAME:eim}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.table=flyway_connectors
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# --- OpenTelemetry ---
quarkus.otel.enabled=true
quarkus.otel.enabled=${QUARKUS_OTEL_ENABLED:true}

# --- Auth: dev gateway-trust headers (SSO mode in staging/prod; SEC-2) ---
eim.auth.mode=${EIM_AUTH_MODE:header}

# --- Kafka (AD-7): sync events + true-up signals ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.sync-events-out.connector=smallrye-kafka
mp.messaging.outgoing.sync-events-out.topic=eim.sync.completed
mp.messaging.outgoing.sync-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.sync-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- REST clients for CRM connectors (endpoints from config only) ---
quarkus.rest-client.sfdc.uri=${SFDC_URI:http://localhost:18080}
quarkus.rest-client.hubspot.uri=${HUBSPOT_URI:http://localhost:18081}

# --- Observability ---
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=true

# --- Tests: real PostgreSQL (AGE image) via port-forward; no docker in surefire ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=${EIM_TEST_DB_URL:jdbc:postgresql://localhost:15433/eim}
%test.quarkus.flyway.table=flyway_connectors
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
%test.quarkus.otel.enabled=false
%test.kafka.bootstrap.servers=${EIM_TEST_KAFKA:localhost:19092}

# TG7-ING-1: ERP read endpoints (NetSuite SuiteQL / SAP OData). URIs and
# tokens come from environment/secret store — WireMock stubs in tests.
quarkus.rest-client.netsuite.uri=${NETSUITE_URI:http://localhost:18082}
quarkus.rest-client.sap.uri=${SAP_URI:http://localhost:18083}
