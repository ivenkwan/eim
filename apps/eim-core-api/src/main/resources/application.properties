quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eim}
quarkus.datasource.password=${DB_PASSWORD:eim}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:eim-postgres}:${DB_PORT:5432}/${DB_NAME:eim}

# core-api owns its own Flyway history table so V2__audit_plane.sql cannot perturb the other
# four services that share the same PostgreSQL database.
quarkus.flyway.table=flyway_schema_history_core_api
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}

# H2 tests must not attempt PostgreSQL-specific DDL (JSONB/TIMESTAMPTZ/PLpgSQL).
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:eim;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=false
