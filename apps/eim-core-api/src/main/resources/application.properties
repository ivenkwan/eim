quarkus.application.name=eim-core-api
quarkus.http.port=8080

# --- DataSource (PostgreSQL, arch doc section 9) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:eim}
quarkus.datasource.password=${DB_PASSWORD:eim-dev}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:eim-postgres}:${DB_PORT:5432}/${DB_NAME:eim}

# --- Flyway: per-service history table (ADR-010); core-api owns V2..V6 ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.table=flyway_core_api
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# --- OpenTelemetry (NFR-90) ---
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}

# --- OIDC (SEC-1/2): bearer validation against Keycloak ---
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:true}
quarkus.oidc.token.header=${OIDC_TOKEN_HEADER:Authorization}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/eim
quarkus.oidc.client-id=eim-core-api
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:dev-only-placeholder}
quarkus.oidc.token.audience=${QUARKUS_OIDC_TOKEN_AUDIENCE:account}
quarkus.oidc.token.principal-claim=preferred_username
# Dev/test header mode toggle (never enable outside bring-up/load tests)
eim.auth.mode=${EIM_AUTH_MODE:oidc}

# --- Kafka (AD-7): outbox export + event audit ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.config-events-out.connector=smallrye-kafka
mp.messaging.outgoing.config-events-out.topic=eim.config.changed
mp.messaging.outgoing.config-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.config-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.config-events-in.connector=smallrye-kafka
mp.messaging.incoming.config-events-in.topic=eim.config.changed
mp.messaging.incoming.config-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.config-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.config-events-in.group.id=eim-core-api-auditor
mp.messaging.incoming.config-events-in.auto.offset.reset=earliest
mp.messaging.incoming.config-events-in.dead-letter-queue.topic=eim.config.changed.dlq
mp.messaging.incoming.sync-events-in.connector=smallrye-kafka
mp.messaging.incoming.sync-events-in.topic=eim.sync.completed
mp.messaging.incoming.sync-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sync-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sync-events-in.group.id=eim-core-api-auditor
mp.messaging.incoming.sync-events-in.auto.offset.reset=earliest
mp.messaging.incoming.sync-events-in.dead-letter-queue.topic=eim.sync.completed.dlq
mp.messaging.incoming.trueup-events-in.connector=smallrye-kafka
mp.messaging.incoming.trueup-events-in.topic=eim.trueup.required
mp.messaging.incoming.trueup-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.trueup-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.trueup-events-in.group.id=eim-core-api-auditor
mp.messaging.incoming.trueup-events-in.auto.offset.reset=earliest
mp.messaging.incoming.trueup-events-in.dead-letter-queue.topic=eim.trueup.required.dlq
mp.messaging.incoming.hierarchy-events-in.connector=smallrye-kafka
mp.messaging.incoming.hierarchy-events-in.topic=eim.hierarchy.changed
mp.messaging.incoming.hierarchy-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.hierarchy-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.hierarchy-events-in.group.id=eim-core-api-auditor
mp.messaging.incoming.hierarchy-events-in.auto.offset.reset=earliest
mp.messaging.incoming.hierarchy-events-in.dead-letter-queue.topic=eim.hierarchy.changed.dlq
mp.messaging.incoming.calc-events-in.connector=smallrye-kafka
mp.messaging.incoming.calc-events-in.topic=eim.calc.run.completed
mp.messaging.incoming.calc-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.calc-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.calc-events-in.group.id=eim-core-api-auditor
mp.messaging.incoming.calc-events-in.auto.offset.reset=earliest
mp.messaging.incoming.calc-events-in.dead-letter-queue.topic=eim.calc.run.completed.dlq

# --- Observability (OPS-2/3): metrics via /q/metrics; JSON logs with MDC ---
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false

# --- Health defaults: /q/health/live, /q/health/ready ---

# --- Tests: point EIM_TEST_DB_URL / EIM_TEST_KAFKA at the live dev-cluster
#     AGE postgres and Kafka (port-forwards); OIDC is simulated by TestSecurity. ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.image-name=apache/age:release_PG16_1.6.0
%test.quarkus.datasource.devservices.reuse=true
%test.quarkus.flyway.table=flyway_core_api
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
%test.quarkus.otel.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.eim.auth.mode=header
%test.quarkus.oidc.auth-server-url=http://127.0.0.1:1/noop
%test.quarkus.datasource.jdbc.url=${EIM_TEST_DB_URL:jdbc:postgresql://localhost:5432/eim}
%test.kafka.devservices.enabled=false
%test.kafka.bootstrap.servers=${EIM_TEST_KAFKA:localhost:9092}
%test.mp.messaging.incoming.config-events-in.auto.offset.reset=earliest
