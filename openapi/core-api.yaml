openapi: 3.1.0
info:
  title: EIM Core API
  version: 0.1.0
  summary: Domain APIs for plans, statements, disputes, exports and administration
servers:
  - url: http://localhost:8080
paths:
  /api/v1/hello:
    get:
      operationId: getHello
      summary: Liveness hello from the service (read-only)
      responses:
        '200':
          description: Service greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
  /api/v1/admin/config-change:
    post:
      operationId: submitConfigChange
      summary: Submit a versioned configuration change into the audit plane (skeleton)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChangeRequest'
      responses:
        '202':
          description: Change accepted into the audited config registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigChangeAccepted'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/payee:
    get:
      operationId: getMyPayee
      summary: RLS-protected seller view (exit criterion TG-1 #1)
      responses:
        '200':
          description: Caller identity + RLS-scoped payee record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MePayeeResponse'
  /api/v1/admin/periods/{periodKey}/lock:
    post:
      operationId: lockPayoutPeriod
      summary: Lock a payout period (SoD — finance_approver only, FR-603)
      x-audit:
        action: PERIOD_LOCK
        stream: action
      parameters:
        - name: periodKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodLockRequest'
      responses:
        '200':
          description: Period locked
        '403':
          description: Role not permitted (SoD)
        '404':
          description: Unknown period
  /api/v1/admin/config-change/{configurationId}/approve:
    post:
      operationId: approveConfigChange
      summary: Approve a governed configuration change (FR-613.2)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - name: configurationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
        '403':
          description: Role not permitted
        '404':
          description: Unknown configuration
  /api/v1/admin/audit/reconcile:
    get:
      operationId: auditReconcile
      summary: AUD-9 evidence (mutation/outbox/event counts + gap)
      responses:
        '200':
          description: Reconciliation window counts
  /api/v1/admin/audit/seals/verify:
    get:
      operationId: auditSealVerify
      summary: AUD-6 seal verification (recompute hash chain)
      responses:
        '200':
          description: Per-day verification results
  /api/v1/admin/audit/graph/reconcile:
    get:
      operationId: auditGraphReconcile
      summary: DAT-4 graph drift check (empty = clean)
      responses:
        '200':
          description: Drift lines
  /api/v1/admin/overrides:
    post:
      operationId: createManualOverride
      summary: Manual adjustment override (separate entry type, original preserved, mandatory reason)
      x-audit:
        action: MANUAL_ADJUSTMENT
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '202':
          description: Override recorded
        '400':
          description: reasonCode/reasonComment missing
        '409':
          description: Period locked
  /api/v1/admin/audit-viewer:
    get:
      operationId: searchAudit
      summary: Audit viewer — search all three streams with CSV/JSON export (audit-read audited)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: stream, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: actionType, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Rows (JSON) or CSV attachment
  /api/v1/admin/exports:
    post:
      operationId: generatePayrollExport
      summary: Payroll export (ADP/Workday/NetSuite templates, hashed, byte-identical regen)
      x-audit:
        action: EXPORT_GENERATION
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: CSV + file hash
        '400':
          description: Unknown template
    get:
      operationId: downloadPayrollExport
      summary: Payroll export download (file stream)
      x-audit:
        action: EXPORT_GENERATION
        stream: action
      parameters:
        - { name: periodId, in: query, required: true, schema: { type: string } }
        - { name: template, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV bytes or metadata
  /api/v1/me/statement:
    get:
      operationId: getStatementOverview
      summary: Seller statement overview (RLS-scoped; read-only during engine outage)
      responses:
        '200':
          description: Overview with components + thermometer
  /api/v1/me/statement/trace/{ledgerId}:
    get:
      operationId: getStatementTrace
      summary: Calculation trace drawer payload (JSONB-bound)
      parameters:
        - name: ledgerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trace
        '404':
          description: Not found for this payee
  /api/v1/me/statement/download:
    get:
      operationId: downloadStatement
      summary: Statement CSV download matching on-screen values
      responses:
        '200':
          description: CSV
  /api/v1/disputes:
    post:
      operationId: submitDispute
      summary: Dispute submission (4 structured categories, backward-chaining pre-tag)
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeSubmission'
      responses:
        '202':
          description: Created with pre-tagged category
    get:
      operationId: listDisputes
      summary: Dispute queue (admin)
      responses:
        '200':
          description: Open tickets
  /api/v1/disputes/{disputeId}/resolve:
    post:
      operationId: resolveDispute
      summary: Approve/reject with mandatory comment; full lifecycle audit
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResolution'
      responses:
        '202':
          description: Resolved
        '409':
          description: Not open
components:
  schemas:
    OverrideRequest:
      type: object
      required: [payoutPeriodId, payeeId, componentName, adjustedAmount, reasonCode, reasonComment]
      properties:
        payoutPeriodId: { type: string }
        payeeId: { type: string }
        componentName: { type: string }
        adjustedAmount: { type: string }
        reasonCode: { type: string }
        reasonComment: { type: string }
        disputeId: { type: [string, 'null'] }
    ExportRequest:
      type: object
      required: [periodId, template]
      properties:
        periodId: { type: string }
        template: { type: string, enum: [ADP, WORKDAY, NETSUITE_JOURNAL] }
    DisputeSubmission:
      type: object
      required: [category, notes]
      properties:
        category: { type: string, enum: [SOURCE_DATA, CREDIT_SPLIT, WINDOW_STATE, PLAN_LOGIC, OTHER] }
        notes: { type: string }
        ledgerId: { type: [string, 'null'] }
        transactionId: { type: [string, 'null'] }
        symptom: { type: [string, 'null'] }
    DisputeResolution:
      type: object
      required: [resolution, comment]
      properties:
        resolution: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: string }
    HelloResponse:
      type: object
      required: [service, status, message]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok]
        message:
          type: string
    ConfigChangeRequest:
      type: object
      required: [entity, reason]
      properties:
        entity:
          type: string
        payload:
          type: string
        reason:
          type: string
    ConfigChangeAccepted:
      type: object
      required: [accepted, requestId]
      properties:
        accepted:
          type: boolean
        requestId:
          type: string
    MePayeeResponse:
      type: object
      properties:
        actor:
          type: string
        correlation_id:
          type: string
        tenant_id:
          type: string
        payee:
          type: object
    PeriodLockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
