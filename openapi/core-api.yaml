openapi: 3.1.0
info:
  title: EIM Core API
  version: 0.1.0
  summary: Domain APIs for plans, statements, disputes, exports and administration
servers:
  - url: http://localhost:8080
paths:
  /api/v1/hello:
    get:
      operationId: getHello
      summary: Liveness hello from the service (read-only)
      responses:
        '200':
          description: Service greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
  /api/v1/admin/config-change:
    post:
      operationId: submitConfigChange
      summary: Submit a versioned configuration change into the audit plane (skeleton)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChangeRequest'
      responses:
        '202':
          description: Change accepted into the audited config registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigChangeAccepted'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/payee:
    get:
      operationId: getMyPayee
      summary: RLS-protected seller view (exit criterion TG-1 #1)
      responses:
        '200':
          description: Caller identity + RLS-scoped payee record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MePayeeResponse'
  /api/v1/admin/periods/{periodKey}/lock:
    post:
      operationId: lockPayoutPeriod
      summary: Lock a payout period (SoD — finance_approver only, FR-603)
      x-audit:
        action: PERIOD_LOCK
        stream: action
      parameters:
        - name: periodKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodLockRequest'
      responses:
        '200':
          description: Period locked
        '403':
          description: Role not permitted (SoD)
        '404':
          description: Unknown period
  /api/v1/admin/periods/{periodKey}/reopen:
    post:
      operationId: reopenPayoutPeriod
      summary: MI-18 break-glass reopen — dual approval (finance_approver AND system_admin, two distinct people, impact memo mandatory)
      x-audit:
        action: PERIOD_REOPEN
        stream: action
      parameters:
        - name: periodKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodReopenRequest'
      responses:
        '200':
          description: PENDING_DUAL_APPROVAL (one signature recorded) or EXECUTED (period OPEN again)
        '400':
          description: impactMemo missing
        '403':
          description: Role not permitted
        '409':
          description: Period not locked, or dual control violated
  /api/v1/accounting/books:
    post:
      operationId: createAccountingBook
      summary: Register an accounting book (conventions, currency, fringe, expedient) with the default classification decision table generated from policy (TG7-ACC-1/2)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingBookRequest'
      responses:
        '200':
          description: Book created
    get:
      operationId: listAccountingBooks
      summary: List accounting books with policy + decision-table version
      responses:
        '200':
          description: Books for the tenant
  /api/v1/accounting/books/{bookId}/dmn:
    put:
      operationId: uploadClassificationDmn
      summary: Upload a bespoke ASC 606 classification decision table (validated on the KIE DMN runtime, versioned, audited — Controller-editable)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
      responses:
        '200':
          description: New decision-table version
        '400':
          description: Decision table failed DMN validation
  /api/v1/accounting/books/{bookId}/classification/classify/{periodKey}:
    post:
      operationId: classifyPeriod
      summary: Classify every ledger entry of a LOCKED period against the book's decision table (FR-901); CAPITALIZE rows become assets with FX lock + schedules
      x-audit:
        action: CALCULATION_RUN
        stream: action
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
        - { name: monthsHint, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Classification summary (capitalized/expensed)
        '409':
          description: Period not locked or empty
  /api/v1/accounting/books/{bookId}/classification/completeness/{periodKey}:
    get:
      operationId: classificationCompleteness
      summary: Pre-close completeness gate (FR-908) — 100% classified or itemized exceptions
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Completeness report
  /api/v1/accounting/books/{bookId}/amortization/rollforward/{periodKey}:
    get:
      operationId: deferredCostRollforward
      summary: Deferred cost rollforward with the accounting identity check + current/non-current split (FR-906.1)
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rollforward row
  /api/v1/accounting/books/{bookId}/amortization/rollforward/{periodKey}/export:
    get:
      operationId: rollforwardDrilldownExport
      summary: Full drill-down CSV (schedule line → asset → ledger → transaction → rep, FR-906.3)
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV
  /api/v1/accounting/books/{bookId}/amortization/reclass/{periodKey}:
    post:
      operationId: stLtReclass
      summary: Monthly ST/LT reclassification journal (FR-906.2)
      x-audit:
        action: GL_PUSH
        stream: action
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Reclass batch
        '409':
          description: Already reclassed
  /api/v1/accounting/books/{bookId}/jes/{periodKey}/{jeType}:
    post:
      operationId: generateJournalBatch
      summary: Generate a journal batch from a template (PAYROLL_ACCRUAL/CAPITALIZATION/AMORTIZATION/IMPAIRMENT/CATCH_UP) with lineage (FR-907.1)
      x-audit:
        action: GL_PUSH
        stream: action
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
        - { name: jeType, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JeGenerateRequest'
      responses:
        '200':
          description: Balanced batch created (PENDING)
        '409':
          description: No source amounts / duplicate
  /api/v1/accounting/books/{bookId}/jes/{periodKey}/balance-check:
    get:
      operationId: journalBalanceCheck
      summary: Period balance gate (FR-907.2) — debits = credits per subsidiary/currency
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Balance report
  /api/v1/accounting/books/{bookId}/jes/batch/{batchId}/push:
    post:
      operationId: pushJournalBatch
      summary: ERP push (PENDING/EXPORTED/FAILED transitions; retry from FAILED) — FR-907.4
      x-audit:
        action: GL_PUSH
        stream: action
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: batchId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpPushRequest'
      responses:
        '200':
          description: Pushed
  /api/v1/accounting/books/{bookId}/jes/batch/{batchId}/ack:
    post:
      operationId: ackJournalBatch
      summary: ERP acknowledgement (EXPORTED → SYNCED)
      x-audit:
        action: GL_PUSH
        stream: action
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: SYNCED
  /api/v1/accounting/assets/{assetId}/churn:
    post:
      operationId: churnAsset
      summary: Full churn (FR-903.1) — zero unposted future lines + impairment of the remainder in the open period
      x-audit:
        action: MANUAL_ADJUSTMENT
        stream: action
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetLifecycleRequest'
      responses:
        '200':
          description: CHURNED with impairment
  /api/v1/accounting/assets/{assetId}/downgrade:
    post:
      operationId: downgradeAsset
      summary: Partial downgrade (FR-903.2) — continue or pro-rata impairment per book policy
      x-audit:
        action: MANUAL_ADJUSTMENT
        stream: action
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetLifecycleRequest'
      responses:
        '200':
          description: DOWNGRADED (or CONTINUE policy)
  /api/v1/accounting/assets/{assetId}/retro-trueup:
    post:
      operationId: retroTrueupAsset
      summary: Retroactive true-up (FR-903.3) — child stream from the original start, cumulative catch-up in the discovery period
      x-audit:
        action: TRUEUP_POSTING
        stream: action
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetLifecycleRequest'
      responses:
        '200':
          description: Child asset + catch-up
  /api/v1/accounting/lineage/gl-lines/{glLineId}:
    get:
      operationId: lineageDrill
      summary: Zero-orphan drill-through GL → schedule → asset → ledger → transaction → rep (FR-909)
      parameters:
        - { name: glLineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Full lineage chain
  /api/v1/accounting/lineage/audit-sample/{periodKey}:
    post:
      operationId: lineageAuditSample
      summary: Monthly sampled lineage audit (NFR-61) — sampled GL lines must resolve end-to-end
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: periodKey, in: path, required: true, schema: { type: string } }
        - { name: sample, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Sample result with orphan list
  /api/v1/disputes/sla:
    get:
      operationId: disputeSlaReport
      summary: SLA timers per category with breach flags (FR-705.2)
      responses:
        '200':
          description: Open disputes with due times
  /api/v1/disputes/{disputeId}/escalate:
    post:
      operationId: escalateDispute
      summary: Escalate an open dispute to its category's escalation role (FR-705.2)
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      parameters:
        - { name: disputeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Escalated
        '409':
          description: Not open / already escalated
  /api/v1/security/attachments/scan:
    post:
      operationId: scanAttachment
      summary: Attachment malware scan gate (FR-704.2/NFR-56) — EICAR vector, executable magics, blocked extensions
      x-audit:
        action: DATA_OVERRIDE
        stream: action
      parameters:
        - { name: filename, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Clean
        '415':
          description: Rejected with findings
  /api/v1/security/gdpr/erasure:
    post:
      operationId: gdprErasure
      summary: GDPR erasure request (NFR-71) — pseudonymize the payee, preserve immutable financials
      x-audit:
        action: DATA_OVERRIDE
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GdprErasureRequest'
      responses:
        '202':
          description: Pseudonymized with ledger rows preserved
  /api/v1/security/residency:
    get:
      operationId: residencyReport
      summary: Data-residency posture report (NFR-72)
      responses:
        '200':
          description: Residency flags
  /api/v1/spm/territories:
    post:
      operationId: createTerritory
      summary: Territory design (effective-dated, hierarchical; FR-1002)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, parentTerritoryId: { type: [string, 'null'] }, effectiveStart: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Territory created
    get:
      operationId: listTerritories
      summary: Territories with quota totals + active assignment counts
      responses:
        '200':
          description: Territories
  /api/v1/spm/territories/{territoryId}/assignments:
    post:
      operationId: assignTerritoryCoverage
      summary: Assign a payee or account key to a territory (effective-dated, split fractions)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      parameters:
        - { name: territoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { payeeId: { type: [string, 'null'] }, accountKey: { type: [string, 'null'] }, splitPct: { type: number }, effectiveStart: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Assignment recorded
  /api/v1/spm/territories/{territoryId}/quotas:
    post:
      operationId: allocateQuota
      summary: Quota allocation per period (FR-1002)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      parameters:
        - { name: territoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [periodKey, quotaAmount], properties: { periodKey: { type: string }, quotaAmount: { type: string } } }
      responses:
        '200':
          description: Quota allocated
  /api/v1/spm/territories/realignment-preview:
    post:
      operationId: realignmentPreview
      summary: What-if realignment preview — pure read of current account routes (FR-1002)
      x-audit:
        action: APPROVAL
        stream: action
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Account routes
  /api/v1/spm/routing:
    post:
      operationId: createRoutingRule
      summary: Account-routing rule feeding credit assignment (FR-1003)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { priority: { type: integer }, matchAccountKey: { type: [string, 'null'] }, matchComponent: { type: [string, 'null'] }, routeToTerritoryId: { type: [string, 'null'] }, routeToPayeeId: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Rule created
    get:
      operationId: listRoutingRules
      summary: Routing rules in priority order
      responses:
        '200':
          description: Rules
  /api/v1/spm/routing/resolve:
    get:
      operationId: resolveAccountRouting
      summary: Resolve the payees an account credits (rule → territory fan-out with splits; FR-1003)
      parameters:
        - { name: accountKey, in: query, required: true, schema: { type: string } }
        - { name: component, in: query, schema: { type: string } }
      responses:
        '200':
          description: Routed payees
  /api/v1/channel/partners:
    post:
      operationId: registerChannelPartner
      summary: Register a channel partner (mTLS cert CN → partner identity, role-separated; FR-1004)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [orgName], properties: { orgName: { type: string }, certCn: { type: [string, 'null'] }, contactEmail: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Partner registered
  /api/v1/channel/partners/whoami:
    get:
      operationId: partnerWhoami
      summary: Partner mTLS CN → partner identity (never internal roles; FR-1004)
      responses:
        '200':
          description: Partner identity
        '401':
          description: Missing/unknown cert CN
  /api/v1/channel/partners/{partnerPayeeId}/statement:
    get:
      operationId: partnerStatement
      summary: Partner statement (reuses the ledger machinery, partner-scoped; FR-1004)
      parameters:
        - { name: partnerPayeeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Statement lines + total
  /api/v1/channel/partners/{partnerPayeeId}/disputes:
    post:
      operationId: partnerDispute
      summary: Partner self-service dispute (reuses dispute machinery; FR-1004)
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      parameters:
        - { name: partnerPayeeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [category, notes], properties: { category: { type: string }, notes: { type: string } } }
      responses:
        '202':
          description: Dispute submitted
  /api/v1/channel/claims:
    post:
      operationId: submitChannelClaim
      summary: Channel claim — eligibility checked at submission (FR-1005)
      x-audit:
        action: APPROVAL
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [partnerPayeeId, programCode, claimPeriodKey, claimedAmount], properties: { partnerPayeeId: { type: string }, programCode: { type: string }, claimPeriodKey: { type: string }, claimedAmount: { type: string } } }
      responses:
        '202':
          description: Claim submitted (ELIGIBILITY_CHECKED or REJECTED)
    get:
      operationId: listChannelClaims
      summary: Channel claims with status + accrual linkage
      responses:
        '200':
          description: Claims
  /api/v1/channel/claims/{claimId}/approve:
    post:
      operationId: approveChannelClaim
      summary: Approve + accrue on the core engine (claimed × program rate → audited ledger entry; FR-1005)
      x-audit:
        action: CALCULATION_RUN
        stream: action
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ACCRUED with ledger entry id
  /api/v1/ai/plan-modeling/requests:
    post:
      operationId: createNlModelRequest
      summary: Natural-language plan modeling — deterministic grammar compiles a draft; human approval always required (FR-408)
      x-audit:
        action: PLAN_EDIT
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [prompt], properties: { prompt: { type: string } } }
      responses:
        '200':
          description: Draft compiled (PENDING_HUMAN)
        '400':
          description: Grammar rejected the prompt
  /api/v1/ai/plan-modeling/requests/{requestId}/decision:
    post:
      operationId: decideNlModelRequest
      summary: Human decision on an AI-generated plan (SoD — requester cannot approve; FR-408)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [APPROVED, REJECTED] } } }
      responses:
        '200':
          description: Decision recorded
        '403':
          description: Requester cannot approve their own draft
  /api/v1/ai/plan-diagnostics/{planVersionHash}:
    post:
      operationId: diagnosePlan
      summary: AI plan diagnostics — windfall/cliff/gaming anomaly detection (FR-1006)
      x-audit:
        action: PLAN_PUBLISH
        stream: action
      parameters:
        - { name: planVersionHash, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Findings persisted
  /api/v1/ai/earnings-explainer/{ledgerId}:
    get:
      operationId: explainEarnings
      summary: GenAI earnings explainer strictly grounded in the stored trace, with dispute handoff (FR-708)
      parameters:
        - { name: ledgerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Narrative + dispute handoff
  /api/v1/migration/spm/{source}:
    post:
      operationId: importLegacySpm
      summary: Legacy-SPM migration importer (Varicent/Xactly/Anaplan shapes; TG8-ONB-1) — deterministic ids make re-imports idempotent
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: Import summary with per-row errors
  /api/v1/partners:


    post:
      operationId: onboardPartner
      summary: Register a partner tenant for onboarding with its IdP federation posture (TG6-ONB-1)
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpsertRequest'
      responses:
        '200':
          description: Partner registered (status ONBOARDING)
        '400':
          description: Invalid name or idpPosture
        '403':
          description: Role not permitted
    get:
      operationId: listPartners
      summary: List partner tenants with onboarding lifecycle status
      responses:
        '200':
          description: Partners for the caller tenant
  /api/v1/partners/{partnerId}/status:
    post:
      operationId: advancePartnerStatus
      summary: Advance a partner one lifecycle step (ONBOARDING→BACKFILLED→PARALLEL_RUN→SIGNED_OFF→LIVE); SIGNED_OFF gated on two 100% sign-offs
      x-audit:
        action: CONFIG_CHANGE
        stream: config
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerStatusRequest'
      responses:
        '200':
          description: Status advanced
        '409':
          description: Not a one-step advance or sign-off gate unmet
  /api/v1/parallel-run/partners/{partnerId}/periods/{periodKey}/legacy-statement:
    post:
      operationId: uploadLegacyStatement
      summary: Upload the legacy system's statement for a period (shadow totals for the parallel run)
      x-audit:
        action: CONNECTOR_RUN
        stream: action
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Rows loaded (upsert per payee)
        '400':
          description: Malformed CSV
  /api/v1/parallel-run/partners/{partnerId}/periods/{periodKey}/diff:
    post:
      operationId: generateParallelDiff
      summary: Regenerate the cent-for-cent EIM-vs-legacy diff for the period (full outer join per payee)
      x-audit:
        action: CALCULATION_RUN
        stream: action
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: payees/matched/discrepant counts
  /api/v1/parallel-run/partners/{partnerId}/periods/{periodKey}:
    get:
      operationId: parallelRunReport
      summary: Per-period diff report with triage state and sign-off evidence
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Diff rows + match rate + signoff hash
  /api/v1/parallel-run/diffs/{diffId}/resolve:
    post:
      operationId: resolveParallelDiff
      summary: Triage a DISCREPANT row (RESOLVED_ADJUSTED flows through the audited override path; note mandatory)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: diffId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiffResolveRequest'
      responses:
        '200':
          description: Row resolved
        '400':
          description: note missing or invalid resolution
        '409':
          description: Row not DISCREPANT
  /api/v1/parallel-run/partners/{partnerId}/periods/{periodKey}/signoff:
    post:
      operationId: signoffParallelPeriod
      summary: Record the cent-for-cent sign-off — refused below a 100.0% match (ONB-4); evidence hash over the diff set
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
        - { name: periodKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sign-off recorded with evidence hash
        '409':
          description: Not at 100% or already signed off
  /api/v1/parallel-run/close-cycle:
    get:
      operationId: closeCycleTelemetry
      summary: Close-cycle telemetry — business days from period end to lock per locked period (ONB-6, SLA < 3)
      responses:
        '200':
          description: Per-period close durations
  /api/v1/admin/config-change/{configurationId}/approve:
    post:
      operationId: approveConfigChange
      summary: Approve a governed configuration change (FR-613.2)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - name: configurationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
        '403':
          description: Role not permitted
        '404':
          description: Unknown configuration
  /api/v1/admin/audit/reconcile:
    get:
      operationId: auditReconcile
      summary: AUD-9 evidence (mutation/outbox/event counts + gap)
      responses:
        '200':
          description: Reconciliation window counts
  /api/v1/admin/audit/seals/verify:
    get:
      operationId: auditSealVerify
      summary: AUD-6 seal verification (recompute hash chain)
      responses:
        '200':
          description: Per-day verification results
  /api/v1/admin/audit/graph/reconcile:
    get:
      operationId: auditGraphReconcile
      summary: DAT-4 graph drift check (empty = clean)
      responses:
        '200':
          description: Drift lines
  /api/v1/admin/overrides:
    post:
      operationId: createManualOverride
      summary: Manual adjustment override (separate entry type, original preserved, mandatory reason)
      x-audit:
        action: MANUAL_ADJUSTMENT
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '202':
          description: Override recorded
        '400':
          description: reasonCode/reasonComment missing
        '409':
          description: Period locked
  /api/v1/admin/audit-viewer:
    get:
      operationId: searchAudit
      summary: Audit viewer — search all three streams with CSV/JSON export (audit-read audited)
      x-audit:
        action: APPROVAL
        stream: action
      parameters:
        - { name: stream, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: actionType, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Rows (JSON) or CSV attachment
  /api/v1/admin/exports:
    post:
      operationId: generatePayrollExport
      summary: Payroll export (ADP/Workday/NetSuite templates, hashed, byte-identical regen)
      x-audit:
        action: EXPORT_GENERATION
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: CSV + file hash
        '400':
          description: Unknown template
    get:
      operationId: downloadPayrollExport
      summary: Payroll export download (file stream)
      x-audit:
        action: EXPORT_GENERATION
        stream: action
      parameters:
        - { name: periodId, in: query, required: true, schema: { type: string } }
        - { name: template, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV bytes or metadata
  /api/v1/me/statement:
    get:
      operationId: getStatementOverview
      summary: Seller statement overview (RLS-scoped; read-only during engine outage)
      responses:
        '200':
          description: Overview with components + thermometer
  /api/v1/me/statement/trace/{ledgerId}:
    get:
      operationId: getStatementTrace
      summary: Calculation trace drawer payload (JSONB-bound)
      parameters:
        - name: ledgerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trace
        '404':
          description: Not found for this payee
  /api/v1/me/statement/download:
    get:
      operationId: downloadStatement
      summary: Statement CSV download matching on-screen values
      responses:
        '200':
          description: CSV
  /api/v1/disputes:
    post:
      operationId: submitDispute
      summary: Dispute submission (4 structured categories, backward-chaining pre-tag)
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeSubmission'
      responses:
        '202':
          description: Created with pre-tagged category
    get:
      operationId: listDisputes
      summary: Dispute queue (admin)
      responses:
        '200':
          description: Open tickets
  /api/v1/disputes/{disputeId}/resolve:
    post:
      operationId: resolveDispute
      summary: Approve/reject with mandatory comment; full lifecycle audit
      x-audit:
        action: DISPUTE_RESOLUTION
        stream: action
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResolution'
      responses:
        '202':
          description: Resolved
        '409':
          description: Not open
components:
  schemas:
    OverrideRequest:
      type: object
      required: [payoutPeriodId, payeeId, componentName, adjustedAmount, reasonCode, reasonComment]
      properties:
        payoutPeriodId: { type: string }
        payeeId: { type: string }
        componentName: { type: string }
        adjustedAmount: { type: string }
        reasonCode: { type: string }
        reasonComment: { type: string }
        disputeId: { type: [string, 'null'] }
    ExportRequest:
      type: object
      required: [periodId, template]
      properties:
        periodId: { type: string }
        template: { type: string, enum: [ADP, WORKDAY, NETSUITE_JOURNAL] }
    DisputeSubmission:
      type: object
      required: [category, notes]
      properties:
        category: { type: string, enum: [SOURCE_DATA, CREDIT_SPLIT, WINDOW_STATE, PLAN_LOGIC, OTHER] }
        notes: { type: string }
        ledgerId: { type: [string, 'null'] }
        transactionId: { type: [string, 'null'] }
        symptom: { type: [string, 'null'] }
    DisputeResolution:
      type: object
      required: [resolution, comment]
      properties:
        resolution: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: string }
    HelloResponse:
      type: object
      required: [service, status, message]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok]
        message:
          type: string
    ConfigChangeRequest:
      type: object
      required: [entity, reason]
      properties:
        entity:
          type: string
        payload:
          type: string
        reason:
          type: string
    ConfigChangeAccepted:
      type: object
      required: [accepted, requestId]
      properties:
        accepted:
          type: boolean
        requestId:
          type: string
    MePayeeResponse:
      type: object
      properties:
        actor:
          type: string
        correlation_id:
          type: string
        tenant_id:
          type: string
        payee:
          type: object
    PeriodLockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    PeriodReopenRequest:
      type: object
      required: [impactMemo]
      properties:
        impactMemo:
          type: string
          description: Documented incident procedure reference + impact assessment (MI-18 P1)
    PartnerUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        idpEntityId: { type: [string, 'null'] }
        idpPosture: { type: string, enum: [GATEWAY_OIDC, SAML_FEDERATED] }
        payeeTarget: { type: integer }
    PartnerStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ONBOARDING, BACKFILLED, PARALLEL_RUN, SIGNED_OFF, LIVE] }
    DiffResolveRequest:
      type: object
      required: [resolution, note]
      properties:
        resolution: { type: string, enum: [RESOLVED_ADJUSTED, RESOLVED_EXPLAINED] }
        note: { type: string }
    AccountingBookRequest:
      type: object
      required: [bookCode]
      properties:
        bookCode: { type: string }
        description: { type: [string, 'null'] }
        functionalCurrency: { type: string }
        amortizationConvention: { type: string, enum: [EXACT_DAILY, FULL_MONTH, MID_MONTH, PO_WEIGHTED] }
        expedientThresholdMonths: { type: integer }
        fringeRate: { type: string }
        capitalizeManagerOverrides: { type: boolean }
        seSpiffPolicy: { type: string, enum: [FORMULAIC_ONLY, ALWAYS, NEVER] }
        renewalPolicy: { type: string, enum: [CAP_NON_COMMENSURATE, CAP_ALWAYS, EXPENSE] }
        downgradePolicy: { type: string, enum: [CONTINUE, PRO_RATE_IMPAIR] }
    JeGenerateRequest:
      type: object
      properties:
        subsidiary: { type: string }
        costCenter: { type: string }
    ErpPushRequest:
      type: object
      properties:
        erpTarget: { type: string, enum: [NETSUITE, SAP, WORKDAY] }
        simulateFailure: { type: string }
    AssetLifecycleRequest:
      type: object
      properties:
        openPeriodKey: { type: string }
        discoveryPeriodKey: { type: string }
        contractionPct: { type: number }
        additionalAmount: { type: string }
        comment: { type: string }
    GdprErasureRequest:
      type: object
      required: [payeeId, reason]
      properties:
        payeeId: { type: string }
        reason: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
