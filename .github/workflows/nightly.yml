name: nightly

# TG9-A4 / todo.md §3 nightly tier: the benchmark + soak + audit-reconciliation
# checks that keep the NFR budgets honest between releases. Runs on a kind
# cluster provisioned in-runner; the harness scripts are the same ones used
# interactively (verify-tg3.sh benchmark section, tg5-scale-load latency SLOs,
# tg5-audit-pack assurance) so a nightly failure reproduces locally.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  benchmark-and-soak:
    name: Nightly benchmark + latency SLO + audit assurance (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAVA_HOME: /opt/java/openjdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install kind + kubectl + helm
        run: |
          curl -sfL https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64 -o /usr/local/bin/kind
          chmod +x /usr/local/bin/kind
          curl -sfLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl -sfL https://get.helm.sh/helm-v3.16.1-linux-amd64.tar.gz | tar -xz
          install linux-amd64/helm /usr/local/bin/helm

      - name: Build all service images
        run: |
          mvn -B -ntp -f apps/pom.xml -DskipTests package
          for s in eim-core-api eim-connectors eim-calc-engine eim-process eim-plan-compiler; do
            docker build -q -t "$s:0.1.0-dev" "apps/$s"
          done

      - name: Boot the platform (kind + helm)
        run: |
          kind create cluster --name eim-nightly --image kindest/node:v1.31.0
          kind load docker-image eim-core-api:0.1.0-dev eim-connectors:0.1.0-dev \
            eim-calc-engine:0.1.0-dev eim-process:0.1.0-dev eim-plan-compiler:0.1.0-dev \
            --name eim-nightly || true
          # dev-up generates fresh credentials; the nightly cluster is throwaway
          bash scripts/dev-up.sh
          kind config use-context kind-eim-nightly 2>/dev/null || kubectl config use-context kind-eim-nightly

      - name: Port-forwards
        run: |
          kubectl -n eim port-forward deploy/eim-apisix 31234:9080 &
          kubectl -n eim port-forward deploy/eim-keycloak 31235:8080 &
          kubectl -n eim port-forward sts/eim-postgres 15433:5432 &
          kubectl -n eim port-forward sts/eim-kafka 19092:9092 &
          sleep 10
          curl -sf http://localhost:31234/api/v1/hello

      - name: Latency SLOs + replica parity (NFR-22/25)
        run: |
          bash scripts/tg5-scale-load.sh || { echo "::error::nightly SLO drill failed"; exit 1; }

      - name: Audit assurance pack (seals + tamper control + event hashes)
        run: |
          kubectl -n eim exec -i eim-postgres-0 -- psql -U eim -d eim \
            -v ON_ERROR_STOP=1 < scripts/tg5-audit-pack.sql

      - name: API-plane reconcile is clean (NFR-64, api_gap = 0)
        run: |
          GAP=$(kubectl -n eim exec eim-postgres-0 -- psql -U eim -d eim -tAc \
            "SELECT api_gap FROM eim_ops.reconcile_audit_full(now() - interval '24 hours')")
          echo "api_gap=$GAP"
          [ "$GAP" = "0" ] || { echo "::error::API-plane audit gap — see build log TG-9 §A2"; exit 1; }

      - name: Teardown
        if: always()
        run: kind delete cluster --name eim-nightly
