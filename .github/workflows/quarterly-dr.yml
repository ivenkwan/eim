name: quarterly-dr

# TG9-A4 / todo.md §3 quarterly tier: the full zero-downtime + chaos + DR
# drill — including the AGE-catalog restore to a scratch database with
# ledger/graph/seal integrity parity and the WORM immutability proofs.
# Manual dispatch carries the reason (audit evidence reference).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this drill runs (audit evidence reference)"
        required: true
  schedule:
    - cron: "0 4 1 */3 *" # 04:00 UTC on the 1st, every 3rd month

jobs:
  chaos-dr-drill:
    name: Quarterly chaos + DR drill incl. AGE restore (kind, throwaway)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Record the drill reason
        run: |
          echo "drill reason: ${{ github.event.inputs.reason || 'scheduled quarterly' }}"

      - name: Install kind + kubectl + helm
        run: |
          curl -sfL https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64 -o /usr/local/bin/kind
          chmod +x /usr/local/bin/kind
          curl -sfLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl -sfL https://get.helm.sh/helm-v3.16.1-linux-amd64.tar.gz | tar -xz
          install linux-amd64/helm /usr/local/bin/helm

      - name: Build service images
        run: |
          mvn -B -ntp -f apps/pom.xml -DskipTests package
          for s in eim-core-api eim-connectors eim-calc-engine eim-process eim-plan-compiler; do
            docker build -q -t "$s:0.1.0-dev" "apps/$s"
          done

      - name: Boot the platform (kind + helm)
        run: |
          kind create cluster --name eim-dr --image kindest/node:v1.31.0
          bash scripts/dev-up.sh
          kubectl config use-context kind-eim-dr

      - name: Port-forwards
        run: |
          kubectl -n eim port-forward deploy/eim-apisix 31234:9080 &
          kubectl -n eim port-forward deploy/eim-keycloak 31235:8080 &
          kubectl -n eim port-forward sts/eim-postgres 15433:5432 &
          kubectl -n eim port-forward sts/eim-kafka 19092:9092 &
          sleep 10
          curl -sf http://localhost:31234/api/v1/hello

      - name: Chaos + DR + WORM drill (restore incl. AGE, integrity parity)
        run: |
          bash scripts/tg5-chaos-dr.sh || { echo "::error::quarterly DR drill failed"; exit 1; }

      - name: Teardown
        if: always()
        run: kind delete cluster --name eim-dr
