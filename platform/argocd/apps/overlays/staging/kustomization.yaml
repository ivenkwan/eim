apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Application
      name: eim-env-template
    patch: |-
      - op: replace
        path: /metadata/name
        value: eim-staging
      - op: replace
        path: /spec/source/helm/valueFiles/0
        value: platform/envs/staging.values.yaml
      - op: replace
        path: /spec/destination/namespace
        value: eim-staging
