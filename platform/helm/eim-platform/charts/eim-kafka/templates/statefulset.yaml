apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  labels: { app: {{ .Chart.Name }} }
spec:
  serviceName: {{ .Chart.Name }}
  replicas: 1
  selector:
    matchLabels: { app: {{ .Chart.Name }} }
  template:
    metadata:
      labels: { app: {{ .Chart.Name }} }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format -t {{ .Values.clusterId }} -c /config/server.properties --standalone
              fi
              exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket: { port: plaintext }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # NOTE: mounted at /config, NOT /etc/kafka — the apache/kafka
            # image declares VOLUME /etc/kafka/secrets; mounting the ConfigMap
            # over /etc/kafka makes that nested volume mountpoint read-only
            # and the container fails to start.
            - name: config
              mountPath: /config
            - name: data
              mountPath: /var/lib/kafka
      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}-config
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.persistence.size }} } }
