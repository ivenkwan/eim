apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels: { app: {{ .Chart.Name }} }
data:
  # Standalone routes file (APISIX 3.11): consumed as conf/apisix.yaml with
  # APISIX_STAND_ALONE=true; the trailing #END marker is REQUIRED.
  # Routes are config-as-code, mirrored into the audit plane by the GitOps
  # sync watcher (FR-613.5).
  apisix.yaml: |
    routes:
      # Seller/admin API: OIDC bearer validation at the edge (SEC-2, NFR-51);
      # core-api re-validates and maps claims (defense in depth, SEC-3).
      - uri: /api/v1/me/*
        upstream:
          type: roundrobin
          nodes:
            "eim-core-api:8080": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      - uri: /api/v1/admin/*
        upstream:
          type: roundrobin
          nodes:
            "eim-core-api:8080": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      # Ingestion + hierarchy admin (TG-2): same OIDC edge posture; the
      # connectors service maps trust headers to the tenant/actor context.
      - uri: /api/v1/ingestion/*
        upstream:
          type: roundrobin
          nodes:
            "eim-connectors:8081": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      - uri: /api/v1/org/*
        upstream:
          type: roundrobin
          nodes:
            "eim-connectors:8081": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      # Plan compiler + calc engine (TG-3): same OIDC edge posture.
      - uri: /api/v1/plans/*
        upstream:
          type: roundrobin
          nodes:
            "eim-plan-compiler:8084": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      - uri: /api/v1/calc/*
        upstream:
          type: roundrobin
          nodes:
            "eim-calc-engine:8082": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      # Process engine + disputes (TG-4): same OIDC edge posture.
      - uri: /api/v1/process/*
        upstream:
          type: roundrobin
          nodes:
            "eim-process:8083": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      - uri: /api/v1/disputes
        upstream:
          type: roundrobin
          nodes:
            "eim-core-api:8080": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      - uri: /api/v1/disputes/*
        upstream:
          type: roundrobin
          nodes:
            "eim-core-api:8080": 1
        plugins:
          proxy-rewrite:
            headers:
              set:
                X-Auth-Token: $http_authorization
          openid-connect:
            client_id: eim-gateway
            client_secret: {{ .Values.oidcClientSecret | required "eim-apisix.oidcClientSecret is required (NFR-53)" | quote }}
            discovery: http://eim-keycloak:8080/realms/eim/.well-known/openid-configuration
            bearer_only: true
            ssl_verify: false
            access_token_in_authorization_header: true
      # Health/hello stays open for probes (read-only, no data).
      - uri: /api/v1/hello
        upstream:
          type: roundrobin
          nodes:
            "eim-core-api:8080": 1
    #END
