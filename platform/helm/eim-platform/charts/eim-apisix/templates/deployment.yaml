apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: { app: {{ .Chart.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Chart.Name }} }
  template:
    metadata:
      labels: { app: {{ .Chart.Name }} }
    spec:
      containers:
        - name: apisix
          image: {{ .Values.image }}
          env:
            - name: APISIX_STAND_ALONE
              value: "true"
          args: ["docker-start"]
          ports:
            - name: gateway
              containerPort: 9080
          readinessProbe:
            tcpSocket: { port: gateway }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # subPath file mount: conf/ stays writable for the entrypoint's
            # standalone config generation; only the routes file is ours.
            - name: routes
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
              readOnly: true
      volumes:
        - name: routes
          configMap:
            name: {{ .Chart.Name }}-config
