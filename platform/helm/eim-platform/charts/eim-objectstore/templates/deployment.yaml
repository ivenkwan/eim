apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: { app: {{ .Chart.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Chart.Name }} }
  template:
    metadata:
      labels: { app: {{ .Chart.Name }} }
    spec:
      containers:
        - name: objectstore
          # Dev posture runs SeaweedFS (S3-compatible). Non-dev postures
          # substitute any S3 endpoint via values (NFR-81) — access keys are
          # injected from the secret store, never defaulted (NFR-53).
          image: {{ .Values.image }}
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=9000
            - -master.volumeSizeLimitMB=1024
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}
