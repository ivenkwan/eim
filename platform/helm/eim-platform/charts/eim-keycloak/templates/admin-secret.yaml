apiVersion: v1
kind: Secret
metadata:
  name: eim-keycloak-admin
  labels: { app: eim-keycloak }
type: Opaque
stringData:
  username: {{ .Values.adminUsername | required "eim-keycloak.adminUsername is required (NFR-53)" | quote }}
  password: {{ .Values.adminPassword | required "eim-keycloak.adminPassword is required (NFR-53)" | quote }}
