apiVersion: v1
kind: Secret
metadata:
  name: eim-postgres-backup
  labels: { app: eim-postgres }
type: Opaque
stringData:
  password: {{ .Values.auth.password | required "eim-postgres.auth.password is required" | quote }}
  # 32-byte hex key for AES-256; REQUIRED via --set in non-dev postures.
  encryption-key: {{ .Values.backup.encryptionKey | required "eim-postgres.backup.encryptionKey is required (NFR-53)" | quote }}
