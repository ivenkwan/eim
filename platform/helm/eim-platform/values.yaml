# Default posture: single-namespace dev/embedded (TG0-INF-3 dev cluster).
# Production/substitution postures: see ci/*.yaml and scripts/substitution-matrix.sh.
global:
  databaseHost: eim-postgres
  databasePort: "5432"
  databaseName: eim
  databaseUser: eim
  # databasePassword: REQUIRED via --set / external secrets (never defaulted)
  kafkaBootstrapServers: eim-kafka:9092

eim-web:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env
eim-core-api:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env
eim-connectors:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env
eim-calc-engine:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env
eim-process:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env
eim-plan-compiler:
  enabled: true
  otel: { enabled: false }  # dev: no collector yet (TG-1); enable per-env

eim-postgres:
  enabled: true
  image: apache/age:release_PG16_1.6.0
  auth:
    database: eim
    username: eim
    # password: REQUIRED via --set (no default credentials in source — NFR-53)

eim-kafka:
  enabled: true
  image: apache/kafka:3.9.0
  clusterId: eim-dev-kraft-cluster-01

eim-objectstore:
  enabled: true
  image: chrislusf/seaweedfs:3.80

eim-apisix:
  enabled: true
  image: apache/apisix:3.11.0-debian

eim-keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0.7
  # adminUsername / adminPassword: REQUIRED via --set (NFR-53)
